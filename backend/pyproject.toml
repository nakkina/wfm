[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wfm"
version = "0.1.0"
description = "Workforce Management - POC by Akkina: forecasting, staffing and CP-SAT scheduling"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pyyaml",
    "pandas",
    "openpyxl",
    "statsforecast",
    "ortools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "pandas-stubs",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wfm"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["statsforecast.*", "ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
